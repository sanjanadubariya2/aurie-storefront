      robots and the Open Graph / Twitter tags at runtime via
      src/hooks/useDocumentMeta.js, so no page reuses these. Link-preview bots
      that do not run JavaScript get per-product tags from api/share.js.

    <link rel="canonical" href="https://www.aurie.website/" />

    <meta property="og:site_name" content="Aurie" />

      property="og:description"

    <meta property="og:locale" content="en_IN" />
